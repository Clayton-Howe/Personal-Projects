<!DOCTYPE html>
<head>
<link rel = "stylesheet" href= "style.css">
<title>Monster Mash</title>

</head>
<body>
<div id = "Player-Info">
  <h1>Mumflr Fumperdink</h1>
  <h3>
    HP:<span id = "Player-HP">100</span>/100 
    NRG:<span id = "Player-NRG">200</span>/200 
  </h3>
  <img src="Images/Mumflr-Fumperdink.jpg" width = 200px height =300px  >
</div>
<div id = "Monster-Info">
  <h1></h1>
  <h3>HP:variable DMG:Variable</h3>
  <img  id = "Current-Monster" src="Images/Enchanted-Armour.png" width = 300px height= 300px>
</div>
<div id = "Attack-Images">
  <img id = "Magic-Ball" src = "Images/Magic-Ball.jpg" width = 60px height = 60px>
  <img id = "Mace" src = "Images/Mace.png" width = 90px height = 90px>
  <img id = "Rapier" src = "Images/Rapier.png" width = 90px height = 90px>
  <img id = "Sword" src = "Images/Sword.jpg" width = 90px height = 90px>
</div>
<div id = "Attack-Bank">
  <button id = "Magic-Button" > Magic NRG:25 Dmg:25 </button>
  <button id = "Mace-Button">  Mace NRG:15  Dmg:15</button>
  <button id = "Rapier-Button">Rapier NRG:5 Dmg:5</button>
  <button id = "Sword-Button"> Sword NRG:10 Dmg:10</button>
</div>

<div id = "Monster-Order">
  <h1>Monster Order</h1>
  <img id = "first-Monster" width=90px height=90px>
  <img id = "second-Monster" width=90px height=90px>
  <img id = "third-Monster" width=90px height=90px>
  <img id = "fourth-Monster" width=90px height=90px>
</div>

<button id = "Help-Button" >Help?</button>

<script src ="monster-mashing.js"></script>
</body>
</html>
